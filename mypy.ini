# Static type check run by ci/bootstrap.sh stage 5 (production-readiness item 4, 2026-10-05):
#   python -m mypy
# mypy is pinned in requirements.txt. pyright (the checker the audits use) reads pyrightconfig.json.
[mypy]
python_version = 3.12
files = prop_alpha, scripts, tests
warn_unused_ignores = True
warn_redundant_casts = True

# Neither ships type information and no stub package is pinned: imports from them are typed Any.
[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
